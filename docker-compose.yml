# NameArena 部署编排
# 用法：
#   docker compose up -d --build     # 构建并启动
#   docker compose logs -f           # 看日志
#   docker compose ps                # 查看状态
#
# 自定义端口：修改下方 ports 的宿主侧端口（容器内固定 8787），例如 "9000:8787"
#
# 数据持久化：战绩与队伍存于命名卷 namearena-data
#   备份：  docker cp namearena:/app/apps/server/data ./data-backup
#   恢复：  docker cp ./data-backup/. namearena:/app/apps/server/data/ && docker compose restart
#
# 搭配 frp 内网穿透：在运行 frpc 的机器配置中追加代理段
#   [[proxies]]
#   name = "namearena"
#   type = "tcp"
#   localIP = "host.docker.internal"   # frpc 为容器且与 namearena 同宿主机时
#   localPort = 8787
#   remotePort = 8787                  # frp 服务器上对外暴露的端口
services:
  namearena:
    build: .
    image: namearena:latest
    container_name: namearena
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - namearena-data:/app/apps/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  namearena-data:
